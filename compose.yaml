services:
  app:
    build:
      context: .
      target: runner
    env_file:
      - path: ${WEB_ENV_FILE:-.web.env}
        required: true
    ports:
      - "127.0.0.1:8000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - path: ${API_ENV_FILE:-.api.env}
        required: true
    profiles: ["migrate"]

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: ${WORKER_ENV_FILE:-.worker.env}
        required: true
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Compose exposes only plaintext service DNS. Railway's private HTTPS endpoint
  # is intentionally not aliased here.
  api:
    build:
      context: .
      target: api-runner
    env_file:
      - path: ${API_ENV_FILE:-.api.env}
        required: true
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      target: admin-runner
    env_file:
      - path: ${ADMIN_ENV_FILE:-.admin.env}
        required: true
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8003:3003"
    restart: unless-stopped
    init: true
    profiles: ["admin"]
    # Syntax/build validation only: this profile cannot supply Railway private
    # HTTPS or a local OAuth callback environment for the admin BFF.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
